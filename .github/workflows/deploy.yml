name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            set -e

            APP_DIR=/home/panos/development/laravel/Agrivall-Web-Panagiotis
            REPO_URL=https://github.com/SaidinPrev/Agrivall-Web-Panagiotis.git
            PARENT_DIR="$(dirname "$APP_DIR")"
            BACKUP_DIR="$(mktemp -d)"

            trap 'rm -rf "$BACKUP_DIR"' EXIT
            mkdir -p "$PARENT_DIR"

            if [ -d "$APP_DIR" ]; then
              if [ -f "$APP_DIR/vendor/bin/sail" ]; then
                (
                  cd "$APP_DIR"
                  ./vendor/bin/sail down || true
                )
              fi

              if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" "$BACKUP_DIR/.env"
              fi

              if [ -d "$APP_DIR/storage" ]; then
                cp -a "$APP_DIR/storage" "$BACKUP_DIR/storage"
              fi

              rm -rf "$APP_DIR"
            fi

            git clone --branch main --depth 1 "$REPO_URL" "$APP_DIR"
            cd "$APP_DIR"

            if [ -f "$BACKUP_DIR/.env" ]; then
              cp "$BACKUP_DIR/.env" "$APP_DIR/.env"
            elif [ ! -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env.example" "$APP_DIR/.env"
            fi

            if [ -d "$BACKUP_DIR/storage" ]; then
              rm -rf "$APP_DIR/storage"
              cp -a "$BACKUP_DIR/storage" "$APP_DIR/storage"
            fi

            docker run --rm -u "$(id -u):$(id -g)" \
              -v "$APP_DIR":/app -w /app composer:2 \
              composer install --no-interaction --prefer-dist --no-progress

            docker run --rm -u "$(id -u):$(id -g)" \
              -v "$APP_DIR":/app -w /app node:22 \
              npm ci

            docker run --rm -u "$(id -u):$(id -g)" \
              -v "$APP_DIR":/app -w /app node:22 \
              npm run build

            ./vendor/bin/sail up -d --build

            until ./vendor/bin/sail exec -T mysql mysqladmin ping -h"mysql" --silent; do
              echo "Waiting for MySQL..."
              sleep 2
            done

            ./vendor/bin/sail artisan migrate --force
            ./vendor/bin/sail artisan optimize:clear
